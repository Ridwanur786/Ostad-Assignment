{% extends 'base.html' %}

{% block title %}
Login - My Blog
{% endblock %}

{% block content %}

<div class="row justify-content-center">

   <div class="col-md-5">

      <div class="card shadow-sm">

         <div class="card-body">

            <h1 class="mb-4">
               Login
            </h1>

            <form method="post">

               {% csrf_token %}

               {{ form.as_p }}

               {% if next %}
               <input type="hidden" name="next" value="{{ next }}">
               {% endif %}

               <button type="submit" class="btn btn-primary w-100">
                  Login
               </button>

            </form>

            <p class="mt-3 text-center">

               Don't have an account?

               <a href="{% url 'register' %}">
                  Register
               </a>

            </p>

         </div>

      </div>

   </div>

</div>

{% endblock %}
