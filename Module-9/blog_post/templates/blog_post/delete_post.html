{% extends 'base.html' %}

{% block title %}
Delete Post - My Blog
{% endblock %}

{% block content %}

<div class="row justify-content-center">

   <div class="col-md-6">

      <div class="card shadow-sm">

         <div class="card-body text-center">

            <h2>
               Delete Post?
            </h2>

            <p>
               Are you sure you want to delete:
            </p>

            <h4>
               "{{ post.title }}"
            </h4>

            <form method="post" class="mt-4">

               {% csrf_token %}

               <button type="submit" class="btn btn-danger">
                  Yes, Delete
               </button>

               <a href="{% url 'post_detail' post.pk %}" class="btn btn-secondary">
                  Cancel
               </a>

            </form>

         </div>

      </div>

   </div>

</div>

{% endblock %}
