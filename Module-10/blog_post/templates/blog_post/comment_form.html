{% extends 'base.html' %}

{% block title %}
{{ title }} - My Blog
{% endblock %}

{% block content %}

<div class="row justify-content-center">
   <div class="col-md-8">

      <div class="card shadow-sm">

         <div class="card-body">

            <h2 class="mb-4">
               {{ title }}
            </h2>

            {% if parent_comment %}
            <div class="alert alert-light border">
               <strong>
                  Replying to {{ parent_comment.author.username }}
               </strong>

               <p class="mb-0 mt-2">
                  {{ parent_comment.content }}
               </p>
            </div>
            {% endif %}

            <form method="POST">

               {% csrf_token %}

               {{ form.as_p }}

               <div class="mt-3">

                  <button type="submit" class="btn btn-primary">
                     Submit
                  </button>

                  <a href="{% url 'post_detail' post.id %}" class="btn btn-secondary">
                     Cancel
                  </a>

               </div>

            </form>

         </div>

      </div>

   </div>
</div>

{% endblock %}
