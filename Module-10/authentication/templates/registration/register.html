{% extends 'base.html' %}

{% block title %}
Register - My Blog
{% endblock %}

{% block content %}

<div class="row justify-content-center">

   <div class="col-md-6">

      <div class="card shadow-sm">

         <div class="card-body">

            <h1 class="mb-4">
               Create Account
            </h1>

            <form method="post">

               {% csrf_token %}

               {{ form.as_p }}

               <button type="submit" class="btn btn-primary w-100">
                  Register
               </button>

            </form>

            <p class="mt-3 text-center">

               Already have an account?

               <a href="{% url 'login' %}">
                  Login
               </a>

            </p>

         </div>

      </div>

   </div>

</div>

{% endblock %}
