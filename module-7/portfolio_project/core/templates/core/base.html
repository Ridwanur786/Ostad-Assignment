{% load static %}
<!doctype html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
   <title>{% block title %}Portfolio{% endblock %}</title>
   <link rel="stylesheet" href="{% static 'css/main.css' %}">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body>
   <nav class="navbar navbar-expand-sm navbar-dark bg-dark fixed-top">
      <div class="container">
         <a class="navbar-brand" href="{% url 'home' %}">Portfolio</a>
         <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
         </button>
         <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ml-auto">
               <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
               <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
               <li class="nav-item"><a class="nav-link" href="{% url 'projects' %}">Project</a></li>
               <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">Contact</a></li>
            </ul>
         </div>
      </div>
   </nav>

   <main>
      {% block content %}{% endblock %}
   </main>

   <footer>
      <div class="container">
         <p class="copyright text-center">&copy; copyright all rights reserved 2026</p>
      </div>
   </footer>

   <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
   <script src="https://kit.fontawesome.com/0499d80141.js" crossorigin="anonymous"></script>
</body>

</html>
