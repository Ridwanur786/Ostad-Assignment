{% extends 'core/base.html' %}

{% block title %}Contact Me{% endblock %}

{% block content %}
<section id="contact-form" class="pt-5 mt-5">
   <div class="container">
      <h2 class="text-center mb-4">Contact Me</h2>
      <form style="max-width: 500px; margin: auto;">
         <div class="form-group"><input type="text" class="form-control" placeholder="First Name"></div>
         <div class="form-group"><input type="text" class="form-control" placeholder="Last Name"></div>
         <div class="form-group"><input type="email" class="form-control" placeholder="Email"></div>
         <div class="form-group"><textarea class="form-control" rows="5" placeholder="Write your message"></textarea>
         </div>
         <button type="button" class="btn btn-dark btn-block">Send</button>
      </form>
   </div>
</section>
{% endblock %}
